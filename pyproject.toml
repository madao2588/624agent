[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aml-memory-candidate"
version = "0.1.0"
description = "A reproducible Add/Search memory service for the Agent Memory Leaderboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "624agent contributors" }]
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
]

[project.scripts]
aml-eval-preflight = "aml_memory.preflight:main"

[project.optional-dependencies]
local = [
  "fastembed==0.8.0",
]
dev = [
  "httpx2>=2.12,<3",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aml_memory"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
